apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-api
  labels:
    app: sensor-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sensor-api
  template:
    metadata:
      labels:
        app: sensor-api
    spec:
      containers:
      - name: sensor-api
        image: timescale-fastapi:latest
        imagePullPolicy: IfNotPresent   # use local image
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sensor-api-secret
              key: DATABASE_URL